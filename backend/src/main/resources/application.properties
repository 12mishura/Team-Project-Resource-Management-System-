spring.application.name=TaskTracker
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

jwt.secret=${JWT_SECRET}
jwt.expiration=PT1H
jwt.refresh-expiration=P14D

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tasktracker}
spring.datasource.username=${DB_USERNAME:tasktracker}
spring.datasource.password=${DB_PASSWORD:tasktracker}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

spring.web.locale=en
spring.web.locale-resolver=fixed
