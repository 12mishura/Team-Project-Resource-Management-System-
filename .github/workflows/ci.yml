name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tasktracker
          POSTGRES_USER: tasktracker
          POSTGRES_PASSWORD: tasktracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasktracker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests
      - name: Start backend
        working-directory: backend
        run: |
          export JWT_SECRET="$(openssl rand -base64 48)"
          nohup java -jar target/TaskTracker-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/auth/me || true)
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Install frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run e2e tests
        working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
          retention-days: 7
